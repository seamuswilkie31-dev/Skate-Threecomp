[package]
name = "skate-threecomp-launcher"
version.workspace = true
edition.workspace = true
license.workspace = true
default-run = "skate-threecomp"

[[bin]]
name = "skate-threecomp"
path = "src/main.rs"

[[bin]]
name = "skate-threecomp-inspect"
path = "src/bin/inspect_source.rs"

[dependencies]
anyhow.workspace = true
directories = "6.0"
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "wgpu"] }
open = "5.3"
rfd = "0.15"
serde.workspace = true
serde_json.workspace = true
threecomp-engine-core = { path = "../../crates/engine-core" }
